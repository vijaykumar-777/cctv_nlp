services:
  postgres:
    image: postgres:16
    environment: {POSTGRES_DB: cctv_db, POSTGRES_USER: cctv_user, POSTGRES_PASSWORD: changeme}
    ports: ["5432:5432"]
    volumes: ["pgdata:/var/lib/postgresql/data"]
  qdrant:
    image: qdrant/qdrant:v1.9.1
    ports: ["6333:6333"]
    volumes: ["qdrantdata:/qdrant/storage"]
  redis:
    image: redis:7
    ports: ["6379:6379"]
volumes: {pgdata: {}, qdrantdata: {}}
